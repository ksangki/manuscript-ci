[review]
max_iterations = 4
candidates = 3
target_score = 92

[models]
# Commands receive the complete prompt on stdin and must print JSON on stdout.
mutator_command = ["./scripts/mutator-wrapper"]
evaluator_command = ["./scripts/evaluator-wrapper"]
timeout_seconds = 180
# Optional: judge pairwise comparisons with a TypeSafe System One model instead of
# evaluator_command. Needs `pip install 'manuscript-ci[typesafe]'` and TYPESAFE_API_KEY.
# pairwise_backend = "typesafe"   # default: "command"
# typesafe_model = "jev-latest"

[context]
writing_brief = "WRITING_BRIEF.md"
dedup_decisions = "DEDUP_DECISIONS.md"
rubric = "REVIEW_RUBRIC.md"

[output]
report_dir = ".manuscript-ci/reports"
